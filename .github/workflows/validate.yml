name: Validate
on:
  pull_request:
    branches: [painel-admin, main]
  push:
    branches: ["painel-admin", "codex/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check scripts/sync-drive-photos.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
